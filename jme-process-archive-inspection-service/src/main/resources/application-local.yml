server:
  port: 8083

jeap:
  swagger:
    status: open
  vault:
    url: http://localhost:8200
    app-role:
      # Fixed AppRole credentials registered by docker/vault-test-config.sh for local testing.
      role-id: 9999-8888-6666
      secret-id: 1234-5678-9012-6666

jme:
  processarchive:
    objectstorage:
      connection:
        access-url: http://localhost:9101
        access-key: rustfsadmin
        secret-key: rustfsadmin

logging.level:
  ch.admin.bit.jeap: DEBUG

spring:
  cloud:
    vault:
      authentication: TOKEN
      token: secret
