spring:
  cloud:
    vault:
      enabled: false
  config:
    import:
      - "jeap-app-config-aws:"

management:
  server:
    base-path: jme-process-archive-service
    port: 52873
    ssl:
      enabled: false

jeap:
  postgresql:
    aws:
      enabled: true
  datasource:
    aws:
      database-name: jme_process_archive_db
  processarchive:
    objectstorage:
      connection:
        region: "eu-central-2"
      storage:
        bucket: jme-processarchive-lockable-obs-nivel-dev
        prefix-mode: DAY
  logging:
    platform: cloudwatch
  monitor:
    prometheus:
      secure: false
  swagger:
    status: open
  security:
    oauth2:
      resourceserver:
        authorization-server:
          issuer: "https://jme-dev.ingress.nivel.bazg.admin.ch/jme-process-archive-auth-scs"
          jwk-set-uri: "https://internal-csp.jme-dev.nivel.bazg.admin.ch/jme-process-archive-auth-scs/.well-known/jwks.json"
  web:
    tls:
      enabled: true
  crypto:
    awskms:
      enabled: true
      default-escrow-key:
        key-type: RSA_4096
        # This is the public part of an RSA-4096 key named "jme-crypto-escrow-key" created in the JME vault
        public-key: |
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAzai8s/gSFMZE8SCdecjy
          Op2TeQCuVwSuw3Zm7DmG7dcvMO6Z2Pao5Q1B6gXRG4HdxUDJPJbzEpAWuv+aa1Gx
          i5AnJT/rlO2SWsABKX/SdhR2YnbjwKBR4ZsbjQeBMQQvow2kD522NBCzyJkQn8pi
          AWqGVurtl0fPjBXZEPbmKV0p88NGr4/ECPT2tB9rkQe7rms9Vjzcvh116m2d1mi/
          jKLfnl1NzPQRGINVqE+WqHF5C2TUHYzzU1HNuL0iG35eX81spP/V29AYIhniJEnE
          QGTzJoscve6xTZDZJxQy3iD+38z9059/BqYJetoxGSNNuv/PC+2ia5PRdotDwoNs
          H5DAabxYA3LsRA9gg/dGFiCPzMWMHizU9rXnhR38rGgwqWgPCBbJvRuxD98A2wF6
          LCMRcSWxEmC19UQqrVZ56pRsjNEzMNZOpfonaCi2rhrT8bRUkCZ8awK9WyoDyNni
          NMScy9xl1o/EhdFaFUgs/fJLNk6mpZTc/fFisOrohn2dDz1PFWbV2/Q/t/4tnKzW
