      keys:
        # TODO: Replace the KMS key with one provisioned by terraform
        # (when https://jira.bit.admin.ch/browse/DST-4722 is done)
        jme-process-archive-example-key:
          key-arn: "arn:aws:kms:eu-central-2:654654230768:key/0b925dc2-b1d0-4678-aac3-39d098280d78"
  ###
  # Note: In a real environment, it is recommended to get the Kafka configuration properties from AWS AppConfig.
  # The properties are shown here only to provide a complete example.
  # All Kafka properties below are system-wide configuration entries. The service-specific authorization happens
  # via the IAM role assigned to the ECS task, and does not need any specific configuration entries.
  ###
  messaging:
    kafka:
      systemName: jme
      cluster:
        other:
          defaultCluster: true
          bootstrapServers: "${aws.services.kafka.bootstrapServers}"
          aws:
            glue:
              registryName: ${aws.services.glue.registryName}
              region: "${aws.services.glue.region}"
              assume-iam-role-arn: "${aws.services.glue.roleArn}"
            msk:
              iamAuthEnabled: true
              region: "${AWS_REGION}"
              assume-iam-role-arn: "${aws.services.kafka.roleArn}"


decree-document.archive.uri: "https://internal-csp.jme-dev.nivel.bazg.admin.ch/jme-process-archive-resource-service/api/archive/decreedocuments/{id}"
diagram.archive.uri: "https://internal-csp.jme-dev.nivel.bazg.admin.ch/jme-process-archive-resource-service/api/diagrams/{id}/archival?version={version}"
