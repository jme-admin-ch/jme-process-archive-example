x-rustfs-common: &rustfs-common
  image: rustfs/rustfs:1.0.0-beta.8
  environment:
    RUSTFS_VOLUMES: /data
    RUSTFS_ADDRESS: 0.0.0.0:9000
    RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    RUSTFS_ACCESS_KEY: rustfsadmin
    RUSTFS_SECRET_KEY: rustfsadmin
    RUSTFS_CONSOLE_ENABLE: "true"
    RUSTFS_REGION: us-east-1
    http_proxy: ''
    https_proxy: ''
    HTTP_PROXY: ''
    HTTPS_PROXY: ''
  healthcheck:
    test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health" ]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 60s

services:
  postgres:
    image: postgres:18-alpine
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jme_process_archive
      POSTGRES_USER: jme_process_archive
      POSTGRES_PASSWORD: jme_process_archive
    volumes:
      - postgres-18-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jme_process_archive -d jme_process_archive" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    <<: *rustfs-common
    hostname: rustfs
    depends_on:
      rustfs-volume-permission-helper:
        condition: service_completed_successfully
    ports:
      - "9101:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

  rustfs-volume-permission-helper:
    image: alpine:3.22.2
    volumes:
      - rustfs-data:/data
    command: sh -c "chown -R 10001:10001 /data"

  createbucket:
    image: amazon/aws-cli:2.32.16
    depends_on:
      rustfs:
        condition: service_healthy
    # Stays running after bucket creation finishes (see the comment on jme-process-archive-service-vault-client),
    # and only reports healthy once the bucket actually exists - the retry loop waiting for RustFS means the
    # container can be "running" well before that, and `docker compose up --wait` only tracks container state,
    # not what the entrypoint script has actually accomplished yet.
    # On CI (behind a corporate HTTP(S) proxy) calls to http://rustfs:9000 - a hostname only resolvable
    # inside this compose network - were being routed through the proxy and failing with HTTP 504, exactly
    # like jme-process-archive-service-vault-client had to work around for its own Vault calls (see below).
    # AWS_MAX_ATTEMPTS/AWS_RETRY_MODE add extra resilience on top in case RustFS itself is just slow to
    # start serving requests under CI's resource constraints; the outer loop retries the actual operation
    # directly rather than a separate probe call.
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        until aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket bit-jme-processarchive-lockable-obs-local --object-lock-enabled-for-bucket \
            || aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket bit-jme-processarchive-lockable-obs-local; do
          i=$$((i + 1))
          if [ "$$i" -ge 60 ]; then
            echo 'Giving up waiting for RustFS after 60 attempts'
            exit 1
          fi
          echo 'Waiting for RustFS...'
          sleep 5
        done
        touch /tmp/bucket-ready
        tail -f /dev/null
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_MAX_ATTEMPTS: "10"
      AWS_RETRY_MODE: adaptive
      http_proxy: ''
      https_proxy: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      no_proxy: 'rustfs'
      NO_PROXY: 'rustfs'
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/bucket-ready" ]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 90s

  jme-process-archive-service-vault-server:
    image: hashicorp/vault:1.21.4
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=secret
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - >
        VAULT_LOCAL_CONFIG={"disable_mlock": true}

  jme-process-archive-service-vault-client:
    image: hashicorp/vault:1.21.4
    links:
      - jme-process-archive-service-vault-server
    depends_on:
      - jme-process-archive-service-vault-server
    volumes:
      - ./vault-test-config.sh:/vault-test-config.sh
      - ./jme-process-archive-service-vault-pol.hcl:/jme-process-archive-service-vault-pol.hcl
      - ./jme-process-archive-inspection-service-vault-pol.hcl:/jme-process-archive-inspection-service-vault-pol.hcl
    # Stays running after the setup script finishes, and only reports healthy once the script (several
    # sequential Vault writes: transit engine, keys, policies, approles) has actually completed - `docker
    # compose up --wait` only tracks container state, not what the script has actually accomplished yet,
    # so a plain "still running" signal would let dependent services start racing against an unfinished setup.
    command: '/bin/sh -c "/bin/sh /vault-test-config.sh && touch /tmp/vault-config-ready && tail -f /dev/null"'
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/vault-config-ready" ]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 90s

  ############################################
  # Kafka Cluster
  ############################################

  broker:
    image: confluentinc/cp-kafka:8.2.0
    hostname: broker
    ports:
      - "12000:12000"
    volumes:
      - ./kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf
    environment:
      # KRaft mode settings
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      # KRaft cluster ID - format properly, a 22-character base64-encoded string, for the confluent platform
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:12000
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:12000,CONTROLLER://0.0.0.0:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Authentication
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      # Temporary storage settings
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  broker-init:
    image: confluentinc/cp-kafka:8.2.0
    # Stays running after the config command finishes, and only reports healthy once it has actually
    # completed - see the comment on jme-process-archive-service-vault-client.
    command: "bash -c \"kafka-configs --bootstrap-server broker:29092 --alter --add-config 'SCRAM-SHA-512=[password=broker-secret]' --entity-type users --entity-name broker-user && touch /tmp/broker-init-ready && tail -f /dev/null\""
    depends_on:
      - broker
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/broker-init-ready" ]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 90s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.0
    hostname: schema-registry
    depends_on:
      broker:
        condition: service_started
      broker-init:
        condition: service_healthy
    ports:
      - "13000:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker:29092



## By default, this config uses default local driver,
## For custom volumes replace with volume driver configuration.
volumes:
  postgres-18-data:
  rustfs-data:
